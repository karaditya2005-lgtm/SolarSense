version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: solarsense-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: solarsense
    volumes:
      - mongo_data:/data/db

  ml-service:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: solarsense-ml
    restart: always
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      ML_INTERNAL_KEY: solarsense-dev-internal-key-super-secure-32
      ML_MODEL_VERSION: v1.0.0
      LOG_LEVEL: info

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: solarsense-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/solarsense
      JWT_ACCESS_SECRET: solarsense-dev-jwt-access-secret-32-chars-long!
      JWT_REFRESH_SECRET: solarsense-dev-jwt-refresh-secret-32-chars-long!
      CORS_ORIGINS: http://localhost:5173
      ML_SERVICE_URL: http://ml-service:8000
      ML_INTERNAL_KEY: solarsense-dev-internal-key-super-secure-32
    depends_on:
      - mongodb
      - ml-service

volumes:
  mongo_data:
