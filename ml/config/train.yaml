version: "v1.0.0"
model_name: "GradientBoostingSolarEstimator"
model_type: "gradient_boosting" # options: random_forest, gradient_boosting, linear_baseline

data:
  raw_path: "data/raw/solar_generation_dataset.csv"
  processed_path: "data/processed/solar_features.csv"
  test_size: 0.2 # chronological split (last 20% reserved for testing)
  validation_size: 0.1

hyperparameters:
  n_estimators: 150
  max_depth: 6
  learning_rate: 0.08
  min_samples_split: 5
  random_state: 42

features:
  - ghiWm2
  - dniWm2
  - dhiWm2
  - temperatureC
  - cloudCoverPct
  - humidityPct
  - windSpeedMs
  - solarElevationDeg
  - hourSin
  - hourCos
  - daySin
  - dayCos

target: "capacityFactor" # acPowerKw / capacityKw
output_dir: "models/v1.0.0"
